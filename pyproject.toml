[project]
name = "entitylink"
version = "0.1.0"
description = "Поиск похожих контрагентов с объяснением и отменой объединения"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "rapidfuzz>=3.10,<4", "scikit-learn>=1.5,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
